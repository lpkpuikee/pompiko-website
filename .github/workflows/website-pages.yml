# Deploy the public Pompiko website to GitHub Pages.
#
# Owner setup (once):
# 1. Repo Settings → Pages → Build and deployment → Source: GitHub Actions
# 2. Push this workflow (or run workflow_dispatch)
# 3. Add Privacy URL in App Store Connect / AdMob only after the published page is verified
name: Deploy website to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-website
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage public site
        run: |
          set -euo pipefail
          mkdir -p public-site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'taprush/privacy-coming-soon.html' \
            --exclude 'README.md' \
            --exclude 'public-site/' \
            ./ public-site/
          # Refuse to publish draft / placeholder privacy content.
          if grep -Rql 'DRAFT — unverified\|\[EFFECTIVE_DATE\|not</strong> a privacy policy\|Privacy policy not published yet' public-site/taprush/privacy; then
            echo "Refusing to publish draft or placeholder privacy policy content" >&2
            exit 1
          fi
          if ! grep -q 'TapRush: Beat the Clock — Privacy Policy' public-site/taprush/privacy/index.html; then
            echo "Privacy page missing expected title" >&2
            exit 1
          fi
          if ! grep -q 'mailto:pompiko.support@gmail.com' public-site/taprush/privacy/index.html; then
            echo "Privacy page missing support email" >&2
            exit 1
          fi
          if grep -q 'noindex' public-site/taprush/privacy/index.html; then
            echo "Privacy page must not set noindex when publishing" >&2
            exit 1
          fi
          ls -la public-site public-site/taprush public-site/taprush/privacy

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
